<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Palmetto Music Group</title>
  <link rel="icon" href="../assets/logo/mark.png" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body data-page="login">
  <div id="site-header"></div>
  <div class="auth-card">
    <img class="mark" src="../assets/logo/mark.png" alt="" />
    <h2 class="center">Sign in with a magic link</h2>
    <p class="muted center">We’ll email a one-time link. Palmetto Baptist team members receive free resource access once attached to the church.</p>
    <form class="form" onsubmit="event.preventDefault(); location.href='../auth/check-email.html?email='+encodeURIComponent(document.getElementById('em').value)">
      <div>
        <label for="em">Email</label>
        <input id="em" type="email" required placeholder="you@palmettobaptist.org" />
      </div>
      <button class="btn btn-lime btn-block" type="submit">Send magic link</button>
    </form>
    <p class="center muted" style="margin-top:20px;font-size:13px">Demo accounts for this mockup</p>
    <div class="hero-actions" style="justify-content:center;margin-top:8px">
      <button class="btn btn-outline btn-sm" onclick="PMG.loginDemo('pbc')">PBC team</button>
      <button class="btn btn-outline btn-sm" onclick="PMG.loginDemo('public')">Public buyer</button>
      <button class="btn btn-forest btn-sm" onclick="PMG.loginDemo('admin')">Admin</button>
    </div>
  </div>
  <div id="site-footer"></div>
  <script src="../js/app.js"></script>
</body>
</html>
