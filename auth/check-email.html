<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Check your email — Palmetto Music Group</title>
  <link rel="icon" href="../assets/logo/mark.svg" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div id="site-header"></div>
  <div class="auth-card center">
    <img class="mark" src="../assets/logo/mark.svg" alt="" />
    <h2>Check your email</h2>
    <p class="muted">We sent a sign-in link to <strong id="who"></strong>. This mockup cannot send mail — use a demo account below.</p>
    <div class="hero-actions" style="justify-content:center">
      <button class="btn btn-lime" onclick="PMG.loginDemo('pbc')">Continue as PBC</button>
      <button class="btn btn-outline" onclick="PMG.loginDemo('public')">Continue as public</button>
    </div>
    <p style="margin-top:20px"><a href="../auth/login.html">Use a different email</a></p>
  </div>
  <div id="site-footer"></div>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById("who").textContent = new URLSearchParams(location.search).get("email") || "your inbox";
  </script>
</body>
</html>
